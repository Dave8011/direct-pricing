<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate beautiful PDF pricelists instantly from a CSV file.">
    <title>Pricelist Generator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <div class="glass-panel">
            <header class="header">
                <div class="logo-icon">📄</div>
                <h1>Pricelist Generator</h1>
                <p>Generate a beautiful PDF from your Google Sheet data.</p>
            </header>

            <form id="generatorForm">
                <div class="form-group">
                    <label for="monthYear">Select Month & Year</label>
                    <select id="monthYear" name="monthYear">
                        <option value="JULY 2026">JULY 2026</option>
                        <option value="AUGUST 2026">AUGUST 2026</option>
                        <option value="SEPTEMBER 2026">SEPTEMBER 2026</option>
                        <option value="OCTOBER 2026">OCTOBER 2026</option>
                        <option value="NOVEMBER 2026">NOVEMBER 2026</option>
                        <option value="DECEMBER 2026">DECEMBER 2026</option>
                    </select>
                </div>

                <div class="note-box" style="margin-bottom: 20px; font-size: 14px; text-align: center; color: var(--text-muted);">
                    Data will be pulled automatically from your Google Sheet (<code>Driect-pdf</code> tab).
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Generate PDF</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>
            
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
