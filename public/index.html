<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate beautiful PDF pricelists instantly from a CSV file.">
    <title>Pricelist Generator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <div class="glass-panel">
            <header class="header">
                <div class="logo-icon">📄</div>
                <h1>Pricelist Generator</h1>
                <p>Upload your CSV to instantly generate a beautiful PDF.</p>
            </header>

            <form id="generatorForm" class="generator-form">
                <div class="form-group">
                    <label for="csvFile">Upload Data (CSV)</label>
                    <div class="file-drop-area" id="dropArea">
                        <span class="file-icon">📁</span>
                        <span class="file-msg">Choose a CSV file or drag it here</span>
                        <input type="file" id="csvFile" name="csvFile" accept=".csv" required>
                    </div>
                    <p class="format-note"><strong>Format:</strong> Category, Product, Package Type, Weight, Price</p>
                </div>

                <div class="form-group">
                    <label for="monthYear">Month & Year (Optional)</label>
                    <input type="text" id="monthYear" name="monthYear" placeholder="e.g. AUGUST 2026" class="text-input">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Generate PDF</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>
            
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
